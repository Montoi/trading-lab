name: aurum
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with npm run setup:env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  migrate:
    image: postgres:17-bookworm
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: aurum
      PGDATABASE: aurum
      PGPASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001_records.sql"]
  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: aurum
      PGDATABASE: aurum
      PGPASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:

